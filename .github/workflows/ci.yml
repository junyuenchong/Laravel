name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Pint + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Backend code style (Pint)
        working-directory: backend
        run: composer lint

      - name: Backend tests (sqlite)
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test

  frontend:
    name: Frontend (Lint + Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (for Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install backend dependencies (for Docker bind mount)
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist
      
      - name: Prepare backend .env (APP_KEY)
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --yes playwright install --with-deps chromium

      - name: Start backend (Docker)
        working-directory: backend
        run: docker compose up -d --build

      - name: Prepare backend database
        working-directory: backend
        run: |
          # Wait for MySQL to accept connections (Compose depends_on doesn't guarantee readiness)
          docker compose exec -T mysql sh -lc 'for i in $(seq 1 60); do mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent && exit 0; sleep 2; done; exit 1'
          docker compose exec -T backend php artisan migrate --seed

      - name: Start frontend (dev server)
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort &
          sleep 2

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
