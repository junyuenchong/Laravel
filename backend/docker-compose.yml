services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PHP_VERSION: "8.4"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PHP_VERSION: "8.4"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      # IMPORTANT: do not override APP_KEY with an empty environment value.
      # Laravel will read APP_KEY from the mounted `.env` file.

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-app}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-${DB_ROOT_PASSWORD:-root}}"

      SESSION_DRIVER: cookie
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_CACHE_DB: "${REDIS_CACHE_DB:-1}"

      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-3600}"
      JWT_SECRET: "${JWT_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"

      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
    user: "0:0"
    volumes:
      - ./:/var/www/html
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - mysql
      - redis
    networks:
      - appnet

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    command: >
      sh -c 'exec redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - appnet

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-app}"
      MYSQL_USER: "${DB_USERNAME:-app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql
    networks:
      - appnet

volumes:
  mysql_data:
  nginx_certs:
  redis_data:


networks:
  appnet:
